# Brotli compression for bayarealandscapingmaterials.com. Install the module
# first (Ubuntu 24.04: sudo apt install libnginx-mod-http-brotli-filter
# libnginx-mod-http-brotli-static), then copy this file to
# /etc/nginx/snippets/balm-brotli.conf; the vhost includes it by glob.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/xml application/javascript application/json
             application/xml application/rss+xml application/manifest+json
             image/svg+xml font/ttf font/otf;
