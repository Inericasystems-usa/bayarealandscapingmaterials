# Reference vhost for bayarealandscapingmaterials.com on Host A (nginx 1.24).
# Install steps and checks: deploy/DEPLOY.md, "nginx".
#
# Needs the host kit (infra/pci/host/30-nginx.sh in the Inerica repo) first: it
# sets server_tokens off and TLS 1.2+ for the whole server, answers the bare IP
# with its own default_server, and installs the two snippets included below.
#
# One canonical host, the apex (apps/web/lib/company.ts). www and plain http
# answer with a single 301 to it. nginx is the only public listener: Next
# (balm-web) and the API (balm-api) listen on 127.0.0.1 (ecosystem.config.cjs).

# /api/maps/distance calls a billed Google API: 10 requests a minute per client.
limit_req_zone $binary_remote_addr zone=balm_maps:1m rate=10r/m;

upstream balm_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream balm_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bayarealandscapingmaterials.com www.bayarealandscapingmaterials.com;

    # certbot renewals (webroot); certbot's nginx plugin adds its own location.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bayarealandscapingmaterials.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bayarealandscapingmaterials.com;

    # The certificate certbot issued for both names (sudo certbot certificates).
    ssl_certificate     /etc/letsencrypt/live/bayarealandscapingmaterials.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bayarealandscapingmaterials.com/privkey.pem;

    include snippets/inerica-security-headers.conf;
    include snippets/inerica-block-dev.conf;

    return 301 https://bayarealandscapingmaterials.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bayarealandscapingmaterials.com;

    ssl_certificate     /etc/letsencrypt/live/bayarealandscapingmaterials.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bayarealandscapingmaterials.com/privkey.pem;

    include snippets/inerica-security-headers.conf;
    include snippets/inerica-block-dev.conf;

    # A level that sets its own proxy_hide_header or add_header inherits none
    # from above, so these stay at server level next to the snippet's, and the
    # locations below set neither.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Nextjs-Cache;
    proxy_hide_header X-Nextjs-Prerender;
    proxy_hide_header X-Nextjs-Stale-Time;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: the API trusts one proxy hop for the client IP
    # (rate limits, login lockout), so a client-sent X-Forwarded-For must not
    # survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Source and build folders are never pages; a plain 404 instead of Next's
    # trailing-slash 308 (which scanners count as "found").
    location ~ ^/(src|apps|packages|node_modules|[.]git|[.]next|[.]turbo|[.]env)(/|$) {
        return 404;
    }

    # Express API. Product photos are uploaded as base64 JSON of up to 12 MB
    # (apps/api/src/modules/uploads.ts); nginx's default limit is 1 MB.
    location = /api/v1 {
        proxy_pass http://balm_api;
    }

    location ^~ /api/v1/ {
        client_max_body_size 12m;
        proxy_pass http://balm_api;
    }

    location = /api/maps/distance {
        limit_req zone=balm_maps burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://balm_web;
    }

    location / {
        proxy_pass http://balm_web;
    }
}
